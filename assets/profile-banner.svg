    <text x="52" y="131" fill="#F2F6FF" font-size="59" font-weight="700" letter-spacing="-2">Sri Rajendra</text>
    <text x="52" y="197" fill="#F2F6FF" font-size="59" font-weight="700" letter-spacing="-2">Dabburi<tspan fill="#77E8C3">.</tspan></text>
    <rect x="56" y="222" width="343" height="40" rx="20" fill="#172F39" stroke="#315B58"/>
    <circle cx="78" cy="242" r="4" fill="#77E8C3"/>
    <text x="94" y="248" fill="#B4F5DE" font-size="18" font-weight="600">Software Engineer @ Meta</text>
    <text x="57" y="310" fill="#A9B7CE" font-size="18">Java + Python<tspan dx="14" fill="#536985">/</tspan><tspan dx="14">Previously DaVita &amp; Amazon</tspan></text>
  </g>
  <g transform="translate(1010 172)">
    <circle r="126" stroke="#335070" stroke-dasharray="3 10" opacity=".7"/>
    <circle r="98" stroke="#29445F"/>
    <rect x="-72" y="-72" width="144" height="144" rx="31" transform="rotate(-12)" fill="#15263D" stroke="#456990"/>
    <rect x="-65" y="-65" width="130" height="130" rx="27" fill="#0D1C30" stroke="#7AA9FF" stroke-opacity=".55"/>
    <path d="M-45-16-57 0-45 16M45-16 57 0 45 16" stroke="#77E8C3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="11" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1" fill="#F2F6FF">SRD</text>
    <circle cx="0" cy="-98" r="6" fill="#7AA9FF"/>
    <circle cx="98" cy="0" r="6" fill="#77E8C3"/>
    <circle cx="-89" cy="44" r="4" fill="#7AA9FF"/>
