<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sri Rajendra Dabburi — Software Engineer at Meta</title>
  <desc id="desc">Backend engineering, cloud systems, and applied AI. Previously DaVita and Amazon. A navy banner with blue and mint accents and a geometric SRD monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C35"/><stop offset="1" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="accent" x1="55" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AA9FF"/><stop offset="1" stop-color="#77E8C3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 170) rotate(90) scale(255)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244E76" stop-opacity=".48"/><stop offset="1" stop-color="#0A1222" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#647995" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" stroke="#273852"/>
  <path d="M22 1H1178" stroke="url(#accent)" stroke-width="3"/>
  <rect x="840" y="2" width="358" height="356" rx="20" fill="url(#grid)"/>
  <rect x="800" y="2" width="398" height="356" rx="20" fill="url(#glow)"/>
